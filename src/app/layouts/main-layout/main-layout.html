<div class="app">
  <app-sidebar [open]="sidebarOpen" (closeMenu)="closeSidebar()" />

  <div class="container">
    <app-navbar
      [userName]="userName()"
      [initials]="initials()"
      [menuOpen]="sidebarOpen"
      (toggleMenu)="toggleSidebar()"
    />

    <main class="page-content">
      <button type="button" (click)="logout()">Sair da conta</button>
      @if (logoutError()) {
        <p role="alert">{{ logoutError() }}</p>
      }
      <router-outlet />
    </main>
  </div>
</div>
